version: 1
backend:
  phases:
    build:
      commands:
        # Use legacy-peer-deps to bypass version conflicts in the AWS SDK
        - npm ci --legacy-peer-deps
        - npx ampx pipeline-deploy --app-id $AWS_APP_ID --branch $AWS_BRANCH
frontend:
  phases:
    preBuild:
      commands:
        # Consistency is key; use the same flag for the frontend install
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*